<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Court 2 Reservations</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/site.css}" rel="stylesheet">
</head>
<body class="bg-light">

<main class="container py-4 app-shell schedule-shell">
    <header class="app-topbar schedule-topbar">
        <div>
            <p class="eyebrow">Court 2</p>
            <h1 class="mb-0">Court 2 Schedule</h1>
            <p class="lead-copy">Seven-day schedule with 90-minute beach volley slots.</p>
        </div>
        <div class="topbar-actions">
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-outline-danger">Logout</button>
            </form>
        </div>
    </header>

    <div th:if="${message}" class="alert alert-warning">
        <p th:text="${message}"></p>
    </div>

    <section class="schedule-toolbar" aria-label="Schedule status">
        <div class="status-legend">
            <span class="legend-item"><span class="legend-dot"></span>Available</span>
            <span class="legend-item"><span class="legend-dot reserved-dot"></span>Reserved</span>
        </div>
        <span class="price-pill">20 lei / slot</span>
    </section>

    <div class="table-responsive schedule-scroll">
        <table class="table table-bordered table-hover text-center schedule-table">
            <thead class="table-dark">
            <tr>
                <th scope="col">Time</th>
                <th scope="col" th:each="day : ${days}">
                    <span class="schedule-day">
                        <span class="day-name" th:text="${#temporals.format(day, 'EEE')}">Mon</span>
                        <span class="day-date" th:text="${#temporals.format(day, 'dd MMM')}">01 Jan</span>
                    </span>
                </th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="timeSlot : ${timeSlots}">
                <td class="time-cell" th:text="${timeSlot}"></td>
                <td class="slot-cell"
                    th:classappend="${reservation_matrix[#temporals.format(day,'dd-MM-yyyy') + ' ' + timeSlot]} ? 'reserved' : 'available'"
                    th:each="day : ${days}"
                    th:text="${reservation_matrix[#temporals.format(day,'dd-MM-yyyy') + ' ' + timeSlot]} ? 'Reserved' : 'Available'"
                    th:attr="data-date=${#temporals.format(day,'dd-MM-yyyy')}, data-time=${timeSlot}, data-field=${fieldNumber}">
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="split-actions">
        <form th:action="@{/home}" method="get">
            <button type="submit" class="btn btn-secondary btn-lg">Back to Home</button>
        </form>

        <form th:action="@{/cart/view}" method="get">
            <input type="hidden" name="fieldNumber" th:value="${fieldNumber}" />
            <button type="submit" class="btn btn-success btn-lg">Go to Cart</button>
        </form>
    </div>
</main>

<div id="popupOverlay"></div>

<form id="addToCartForm" th:action="@{/cart/add}" method="post" style="display:none;">
    <input type="hidden" name="reservationDate" id="cartReservationDate">
    <input type="hidden" name="reservationTime" id="cartReservationTime">
    <input type="hidden" name="fieldNumber" id="cartFieldNumber">
</form>

<div id="reservationPopup" role="dialog" aria-modal="true" aria-labelledby="reservationPopupTitle">
    <p class="eyebrow">Reservation</p>
    <h3 id="reservationPopupTitle">Confirm Reservation</h3>
    <p id="popupSlot" class="slot-summary"></p>
    <p class="mb-3"><strong>Price:</strong> 20 lei</p>
    <div class="modal-actions">
        <button id="popupYesBtn" class="btn btn-success" type="button">Add to cart</button>
        <button id="popupNoBtn" class="btn btn-danger" type="button">Cancel</button>
    </div>
</div>

<div id="toast"></div>

<script>
    const cells = document.querySelectorAll("td.available, td.reserved");
    const popup = document.getElementById("reservationPopup");
    const overlay = document.getElementById("popupOverlay");

    cells.forEach(cell => {
        cell.addEventListener("click", () => {
            if (cell.classList.contains("reserved")) {
                showToast("This slot is already reserved!");
                return;
            }

            const date = cell.getAttribute("data-date");
            const time = cell.getAttribute("data-time");
            const fieldNumber = cell.getAttribute("data-field");

            document.getElementById("popupSlot").innerText = "Slot: " + date + " " + time;

            overlay.style.display = "block";
            popup.style.display = "block";
            setTimeout(() => popup.classList.add("show"), 10);

            document.getElementById("popupYesBtn").onclick = () => {
                document.getElementById("cartReservationDate").value = date;
                document.getElementById("cartReservationTime").value = time;
                document.getElementById("cartFieldNumber").value = fieldNumber;
                document.getElementById("addToCartForm").submit();

                hidePopup();
            };

            document.getElementById("popupNoBtn").onclick = hidePopup;
        });
    });

    function hidePopup() {
        popup.classList.remove("show");
        setTimeout(() => {
            popup.style.display = "none";
            overlay.style.display = "none";
        }, 300);
    }

    function showToast(message) {
        const toast = document.getElementById("toast");
        toast.innerText = message;
        toast.style.visibility = "visible";
        setTimeout(() => { toast.style.visibility = "hidden"; }, 2500);
    }

    function updateReservationMatrix() {
        const fieldNumber = /*[[${fieldNumber}]]*/ '2';

        fetch(`/field/${fieldNumber}/matrix`)
            .then(res => res.json())
            .then(matrix => {
                document.querySelectorAll("td.available, td.reserved").forEach(cell => {
                    const date = cell.getAttribute("data-date");
                    const time = cell.getAttribute("data-time");
                    const key = date + " " + time;
                    if (matrix[key]) {
                        cell.classList.remove("available");
                        cell.classList.add("reserved");
                        cell.innerText = "Reserved";
                    } else {
                        cell.classList.remove("reserved");
                        cell.classList.add("available");
                        cell.innerText = "Available";
                    }
                });
            });
    }

    setInterval(updateReservationMatrix, 30000);
    updateReservationMatrix();
</script>

</body>
</html>
