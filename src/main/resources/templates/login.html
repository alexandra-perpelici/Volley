<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow p-4" style="width: 100%; max-width: 400px;" id="loginCard">
        <h3 class="card-title text-center mb-3" id="loginTitle">Login</h3>

        <!-- Success message after registration -->
        <div th:if="${successMessage}" class="alert alert-success" role="alert" id="successMessage">
            <p th:text="${successMessage}"></p>
        </div>

        <!-- Error message if login fails -->
        <div th:if="${param.error}" class="alert alert-danger" role="alert" id="loginError">
            Invalid username or password
        </div>

        <form th:action="@{/login}" method="post" autocomplete="off" id="loginForm">
            <div class="mb-3">
                <label class="form-label" for="usernameInput">Username</label>
                <input
                        type="text"
                        id="usernameInput"
                        name="username"
                        class="form-control"
                        autocomplete="new-username"
                        required
                >
            </div>

            <div class="mb-3">
                <label class="form-label" for="passwordInput">Password</label>
                <input
                        type="password"
                        id="passwordInput"
                        name="password"
                        class="form-control"
                        autocomplete="new-password"
                        required
                >
            </div>

            <button type="submit" class="btn btn-primary w-100" id="loginButton">
                Login
            </button>
        </form>

        <form th:action="@{/register}" method="get" class="mt-3" id="registerForm">
            <button type="submit" class="btn btn-secondary w-100" id="registerButton">
                Register
            </button>
        </form>
    </div>
</div>

</body>
</html>
