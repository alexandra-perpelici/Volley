<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#087b93">
    <title>Autentificare</title>
    <link rel="manifest" th:href="@{/manifest.webmanifest}">
    <link rel="icon" type="image/png" sizes="192x192" th:href="@{/img/icons/icon-192.png}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/site.css(v='booking-ui-13')}" rel="stylesheet">
</head>
<body class="bg-light auth-shell login-page">

<main class="auth-page">
    <section class="auth-layout" aria-labelledby="loginTitle">
        <aside class="auth-visual" aria-label="Riviera">
            <div class="auth-brand">
                <span class="brand-mark">VB</span>
                <span>Riviera</span>
            </div>
            <div class="auth-visual-copy">
                <p class="eyebrow">Rezervari volei</p>
                <h2>Riviera 1 si Riviera 2</h2>
                <div class="auth-visual-meta" aria-label="Detalii rapide">
                    <span>40 RON / ora</span>
                    <span>Cash la teren</span>
                </div>
            </div>
        </aside>

        <section class="card shadow auth-card" id="loginCard" aria-labelledby="loginTitle">
            <div class="auth-card-body">
                <p class="eyebrow">Acces cont</p>
                <h1 class="auth-title card-title" id="loginTitle">Autentificare Riviera</h1>

                <div th:if="${successMessage}" class="alert alert-success mb-3" role="alert" id="successMessage">
                    <p th:text="${successMessage}"></p>
                </div>

                <div th:if="${param.error}" class="alert alert-danger mb-3" role="alert" id="loginError">
                    Utilizator sau parola incorecta
                </div>

                <form th:action="@{/login}" method="post" autocomplete="off" id="loginForm">
                    <div class="mb-3">
                        <label class="form-label" for="usernameInput">Utilizator</label>
                        <input
                                type="text"
                                id="usernameInput"
                                name="username"
                                class="form-control"
                                autocomplete="new-username"
                                required
                        >
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="passwordInput">Parola</label>
                        <input
                                type="password"
                                id="passwordInput"
                                name="password"
                                class="form-control"
                                autocomplete="new-password"
                                required
                        >
                    </div>

                    <button type="submit" class="btn btn-primary" id="loginButton">
                        <i class="bi bi-box-arrow-in-right" aria-hidden="true"></i>
                        <span>Intra in cont</span>
                    </button>
                </form>

                <form th:action="@{/register}" method="get" class="mt-3" id="registerForm">
                    <button type="submit" class="btn btn-secondary" id="registerButton">
                        <i class="bi bi-person-plus" aria-hidden="true"></i>
                        <span>Creeaza cont</span>
                    </button>
                </form>
            </div>
        </section>
    </section>
</main>

</body>
</html>
