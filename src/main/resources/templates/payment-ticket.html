<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Payment URL</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/site.css}" rel="stylesheet">
</head>
<body class="bg-light">

<main class="container py-4 app-shell payment-shell">
    <header class="app-topbar">
        <div>
            <p class="eyebrow">Payment</p>
            <h1 class="mb-0">Payment URL</h1>
            <p class="lead-copy">Show this URL to the registry so they can confirm your payment.</p>
        </div>
    </header>

    <section class="detail-panel">
        <label class="form-label" for="registryUrl">Registry confirmation URL</label>
        <input id="registryUrl" class="form-control" readonly th:value="${registryUrl}">
    </section>

    <section class="detail-grid" aria-label="Payment details">
        <div class="detail-item">
            <span>Status</span>
            <strong th:text="${payment.statusLabel}"></strong>
        </div>
        <div class="detail-item">
            <span>Payment method</span>
            <strong th:text="${payment.paymentMethodLabel}"></strong>
        </div>
        <div class="detail-item">
            <span>Total</span>
            <strong><span th:text="${payment.amountLei}"></span> lei</strong>
        </div>
        <div class="detail-item">
            <span>Reservations</span>
            <strong th:text="${payment.reservations.size()}"></strong>
        </div>
    </section>

    <div class="table-responsive card-table-wrap">
        <table class="table table-bordered table-hover text-center align-middle stack-table">
            <thead class="table-dark">
            <tr>
                <th scope="col">Date</th>
                <th scope="col">Time</th>
                <th scope="col">Court</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="reservation : ${payment.reservations}">
                <td data-label="Date" th:text="${reservation.reservation_date}"></td>
                <td data-label="Time" th:text="${reservation.reservation_time}"></td>
                <td data-label="Court" th:text="${reservation.field_number}"></td>
            </tr>
            </tbody>
        </table>
    </div>

    <form th:action="@{/home}" method="get">
        <button type="submit" class="btn btn-primary btn-lg">Back to Home</button>
    </form>
</main>

</body>
</html>
