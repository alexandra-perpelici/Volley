<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#087b93">
    <title>Creeaza cont</title>
    <link rel="manifest" th:href="@{/manifest.webmanifest}">
    <link rel="icon" type="image/png" sizes="192x192" th:href="@{/img/icons/icon-192.png}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/site.css(v='booking-ui-13')}" rel="stylesheet">
</head>
<body class="bg-light auth-shell register-page">

<main class="auth-page">
    <section class="auth-layout" aria-labelledby="registerTitle">
        <aside class="auth-visual" aria-label="Riviera">
            <div class="auth-brand">
                <span class="brand-mark">VB</span>
                <span>Riviera</span>
            </div>
            <div class="auth-visual-copy">
                <p class="eyebrow">Cont nou</p>
                <h2>Rezervi rapid, platesti la teren.</h2>
                <div class="auth-visual-meta" aria-label="Detalii rapide">
                    <span>Riviera 1</span>
                    <span>Riviera 2</span>
                    <span>40 RON / ora</span>
                </div>
            </div>
        </aside>

        <section class="card shadow auth-card" id="registerCard" aria-labelledby="registerTitle">
            <div class="auth-card-body">
                <p class="eyebrow">Cont nou</p>
                <h1 class="auth-title card-title" id="registerTitle">Creeaza cont Riviera</h1>

                <form th:action="@{/register}"
                      th:object="${registrationRequest}"
                      method="post"
                      autocomplete="off"
                      id="registerForm">

                    <div class="mb-3">
                        <label class="form-label" for="usernameInput">Utilizator</label>
                        <input
                                type="text"
                                id="usernameInput"
                                th:field="*{username}"
                                class="form-control"
                                required
                                autocomplete="new-username">
                        <p th:if="${#fields.hasErrors('username')}"
                           th:errors="*{username}"
                           class="text-danger mt-2 mb-0"
                           id="usernameError"></p>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="passwordInput">Parola</label>
                        <input
                                type="password"
                                id="passwordInput"
                                th:field="*{password}"
                                class="form-control"
                                required
                                autocomplete="new-password">
                        <p th:if="${#fields.hasErrors('password')}"
                           th:errors="*{password}"
                           class="text-danger mt-2 mb-0"
                           id="passwordError"></p>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="confirmPasswordInput">Confirma parola</label>
                        <input
                                type="password"
                                id="confirmPasswordInput"
                                th:field="*{confirmPassword}"
                                class="form-control"
                                required>
                        <p th:if="${#fields.hasErrors('confirmPassword')}"
                           th:errors="*{confirmPassword}"
                           class="text-danger mt-2 mb-0"
                           id="confirmPasswordError"></p>
                    </div>

                    <button type="submit"
                            class="btn btn-success"
                            id="registerButton">
                        <i class="bi bi-person-plus" aria-hidden="true"></i>
                        <span>Creeaza cont</span>
                    </button>
                </form>

                <p th:if="${errorMessage}"
                   class="text-danger mt-3 mb-0"
                   th:text="${errorMessage}"
                   id="registerErrorMessage"></p>

                <p th:if="${successMessage}"
                   class="text-success mt-3 mb-0"
                   th:text="${successMessage}"
                   id="registerSuccessMessage"></p>

                <div class="mt-3" id="backToLoginForm">
                    <a th:href="@{/login}"
                       class="btn btn-secondary"
                       id="backToLoginButton">
                        <i class="bi bi-box-arrow-in-left" aria-hidden="true"></i>
                        <span>Inapoi la autentificare</span>
                    </a>
                </div>
            </div>
        </section>
    </section>
</main>

</body>
</html>
