<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Your Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/site.css}" rel="stylesheet">
</head>
<body class="bg-light">

<main class="container py-4 app-shell cart-shell">
    <header class="app-topbar">
        <div>
            <p class="eyebrow">Checkout</p>
            <h1 class="mb-0">Beach Court Cart</h1>
            <p class="lead-copy">Review reserved slots before generating the registry payment URL.</p>
        </div>
    </header>

    <div th:if="${message}" class="alert alert-danger">
        <p th:text="${message}"></p>
    </div>

    <div th:if="${activeBlacklist}" class="alert alert-warning">
        This account is blacklisted from reservations until
        <strong th:text="${#temporals.format(activeBlacklist.endsAt, 'dd MMM yyyy HH:mm')}"></strong>.
    </div>

    <div th:if="${cart.isEmpty()}" class="alert alert-info">
        Your cart is empty.
    </div>

    <div th:if="${!cart.isEmpty()}" class="table-responsive card-table-wrap">
        <table class="table table-bordered table-hover text-center align-middle stack-table">
            <thead class="table-dark">
            <tr>
                <th scope="col">#</th>
                <th scope="col">Date</th>
                <th scope="col">Time</th>
                <th scope="col">Court</th>
                <th scope="col">Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="res, iterStat : ${cart}">
                <td data-label="#" th:text="${iterStat.index + 1}"></td>
                <td data-label="Date" th:text="${res.date}"></td>
                <td data-label="Time" th:text="${res.time}"></td>
                <td data-label="Court" th:text="${res.fieldNumber}"></td>
                <td data-label="Action">
                    <form th:action="@{/cart/delete}" method="post" class="d-inline">
                        <input type="hidden" name="reservationDate" th:value="${res.date}" />
                        <input type="hidden" name="reservationTime" th:value="${res.time}" />
                        <input type="hidden" name="fieldNumber" th:value="${res.fieldNumber}" />
                        <input type="hidden" name="originField" th:value="${fieldNumber}" />
                        <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <form th:if="${!cart.isEmpty()}" th:action="@{/cart/confirm}" method="post" class="checkout-panel">
        <input type="hidden" name="fieldNumber" th:value="${fieldNumber}" />

        <div class="checkout-total mb-4">
            <p class="eyebrow">Total</p>
            <h4>Total Price: <span th:text="${totalPrice}">0</span> lei</h4>
        </div>

        <fieldset class="payment-panel mb-3">
            <legend class="h5">Payment Method</legend>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="paymentMethod" id="cardPayment" value="CARD" required>
                <label class="form-check-label" for="cardPayment">Card at registry</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="paymentMethod" id="cashPayment" value="CASH_AT_REGISTRY">
                <label class="form-check-label" for="cashPayment">Cash at registry</label>
            </div>
        </fieldset>

        <button type="submit" class="btn btn-success btn-lg">Generate Payment URL</button>
    </form>

    <form th:action="@{/cart/back}" method="post" class="mb-0">
        <input type="hidden" name="fieldNumber" th:value="${fieldNumber}" />
        <input type="hidden" name="source" th:value="${fieldNumber == null} ? 'home' : ''" />
        <button type="submit" class="btn btn-secondary btn-lg">Go Back</button>
    </form>
</main>

</body>
</html>
