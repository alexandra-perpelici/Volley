<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Your Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-4">

    <h2 class="mb-4">Your Cart</h2>

    <!-- Empty cart message -->
    <div th:if="${cart.isEmpty()}" class="alert alert-info">
        Your cart is empty.
    </div>

    <!-- Cart table -->
    <div th:if="${!cart.isEmpty()}" class="table-responsive mb-3">
        <table class="table table-bordered table-hover text-center align-middle">
            <thead class="table-dark">
            <tr>
                <th>#</th>
                <th>Date</th>
                <th>Time</th>
                <th>Field</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="res, iterStat : ${cart}">
                <td th:text="${iterStat.index + 1}"></td>
                <td th:text="${res.date}"></td>
                <td th:text="${res.time}"></td>
                <td th:text="${res.fieldNumber}"></td>
                <td>
                    <form th:action="@{/cart/delete}" method="post" class="d-inline">
                        <input type="hidden" name="reservationDate" th:value="${res.date}" />
                        <input type="hidden" name="reservationTime" th:value="${res.time}" />
                        <input type="hidden" name="fieldNumber" th:value="${res.fieldNumber}" />
                        <input type="hidden" name="originField" th:value="${fieldNumber}" />
                        <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Total Price -->
    <div class="mb-4">
        <h4>Total Price: <span th:text="${totalPrice}">0</span> lei</h4>
    </div>

    <!-- Pay button -->
    <form th:action="@{/cart/confirm}" method="post" class="mb-3">
        <input type="hidden" name="fieldNumber" th:value="${fieldNumber}" />
        <button type="submit" class="btn btn-success btn-lg">Pay</button>
    </form>

    <!-- Go Back button -->
    <form th:action="@{/cart/back}" method="post" class="mb-3">
        <input type="hidden" name="fieldNumber" th:value="${fieldNumber}" />
        <input type="hidden" name="source" th:value="${fieldNumber == null} ? 'home' : ''" />
        <button type="submit" class="btn btn-secondary btn-lg">Go Back</button>
    </form>

    <!-- Message -->
    <div th:if="${message}" class="alert alert-danger mt-3">
        <p th:text="${message}"></p>
    </div>

</div>

</body>
</html>
