<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="text-primary">Welcome!</h1>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-outline-danger" id="logoutButton">Logout</button>
        </form>
    </div>

    <div class="mb-4">
        <h3>Select a Field</h3>
        <div class="d-flex flex-wrap mt-2">
            <form th:action="@{/field/1}" method="get" class="me-2 mb-2">
                <button type="submit" class="btn btn-primary btn-lg" id="field1Button">Field 1</button>
            </form>
            <form th:action="@{/field/2}" method="get" class="me-2 mb-2">
                <button type="submit" class="btn btn-primary btn-lg" id="field2Button">Field 2</button>
            </form>
        </div>
    </div>

    <!-- Go to Cart -->
    <div>
        <form th:action="@{/cart/view}" method="get">
            <input type="hidden" name="source" value="home" />
            <button type="submit" class="btn btn-success btn-lg">Go to Cart</button>
        </form>
    </div>

</div>

</body>
</html>
