<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Confirm Payment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/site.css}" rel="stylesheet">
</head>
<body class="bg-light">

<main class="container py-4 app-shell payment-shell">
    <header class="app-topbar">
        <div>
            <p class="eyebrow">Registry</p>
            <h1 class="mb-0">Confirm Payment</h1>
            <p class="lead-copy">Review the cart and mark the registry payment as confirmed.</p>
        </div>
    </header>

    <div th:if="${confirmedNow}" class="alert alert-success">
        Payment confirmed.
    </div>

    <section class="detail-grid" aria-label="Payment details">
        <div class="detail-item">
            <span>User</span>
            <strong th:text="${payment.user.username}"></strong>
        </div>
        <div class="detail-item">
            <span>Status</span>
            <strong th:text="${payment.statusLabel}"></strong>
        </div>
        <div class="detail-item">
            <span>Payment method</span>
            <strong th:text="${payment.paymentMethodLabel}"></strong>
        </div>
        <div class="detail-item">
            <span>Total</span>
            <strong><span th:text="${payment.amountLei}"></span> lei</strong>
        </div>
    </section>

    <div class="table-responsive card-table-wrap">
        <table class="table table-bordered table-hover text-center align-middle stack-table">
            <thead class="table-dark">
            <tr>
                <th scope="col">Date</th>
                <th scope="col">Time</th>
                <th scope="col">Court</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="reservation : ${payment.reservations}">
                <td data-label="Date" th:text="${reservation.reservation_date}"></td>
                <td data-label="Time" th:text="${reservation.reservation_time}"></td>
                <td data-label="Court" th:text="${reservation.field_number}"></td>
            </tr>
            </tbody>
        </table>
    </div>

    <form th:if="${payment.status != 'CONFIRMED'}"
          th:action="@{'/registry/payments/' + ${payment.confirmationToken} + '/confirm'}"
          method="post">
        <button type="submit" class="btn btn-success btn-lg">Confirm Payment</button>
    </form>

    <div th:if="${payment.status == 'CONFIRMED'}" class="alert alert-success">
        This payment has already been confirmed.
    </div>
</main>

</body>
</html>
